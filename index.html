<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - SENAI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        .instrucoes {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .campo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input::placeholder {
            color: #999;
            font-size: 13px;
        }
        .btn-cadastrar {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 14px;
        }
        .tela-sucesso {
            background-color: #0000ff;
            color: white;
            text-align: center;
            padding: 60px 40px;
            border-radius: 4px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .tela-sucesso h1 {
            font-size: 20px;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .btn-voltar {
            background-color: white;
            color: #0000ff;
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="tela-cadastro" class="container">
       
        </div>

        <h2>Cadastro de Usuário</h2>

        <form id="meuFormulario" onsubmit="validarEEnviar(event)">
            <div class="campo">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" required>
            </div>

            <div class="campo">
                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento" required>
            </div>

            <div class="campo">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" placeholder="Apenas números (11 dígitos)" maxlength="14" required>
            </div>

            <div class="campo">
                <label for="genero">Gênero:</label>
                <select id="genero" required>
                    <option value="">Selecione</option>
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                    <option value="O">Outro</option>
                </select>
            </div>

            <div class="campo">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" placeholder="(XX) XXXXX-XXXX" required>
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" required>
            </div>

            <div class="campo">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" required>
            </div>

            <div class="campo">
                <label for="estado">UF (Estado):</label>
                <select id="estado" required>
                    <option value="">Selecione</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </div>

            <button type="submit" class="btn-cadastrar">Cadastrar</button>
        </form>
    </div>

    <div id="tela-agradecimento" class="tela-sucesso" style="display: none;">
        <h1>O SENAI AGRADECE SUA INSCRIÇÃO!!!</h1>
        <button class="btn-voltar" onclick="voltarParaCadastro()">Voltar</button>
    </div>

    <script>
        function validarEEnviar(event) {
            event.preventDefault();

            var valorCpf = document.getElementById("cpf").value;

            var apenasNumeros = valorCpf.replace(/\D/g, '');

            if (apenasNumeros.length !== 11) {
                alert("Erro: O CPF deve conter exatamente 11 dígitos numéricos.");
                return false;
            }

            document.getElementById("tela-cadastro").style.display = "none";
            document.getElementById("tela-agradecimento").style.display = "block";
        }

        function voltarParaCadastro() 
            document.getElementById("meuFormulario").reset();
            
            document.getElementById("tela-agradecimento").style.display = "none";
            document.getElementById("tela-cadastro").style.display = "block";
        }
    </script>

</body>
</html>
